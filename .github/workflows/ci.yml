name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "arquivos fora do gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: testes
        run: go test ./...

      - name: testes com detector de corrida
        run: go test -race ./...

      - name: exemplo compila
        run: go build ./...
        working-directory: examples/minimal

  test-platforms:
    # Executa a suíte (unitária + integração por subprocesso) nas plataformas
    # que o README anuncia. -short pula as corridas entre processos do BUG-04,
    # que continuam rodando no job "test" em Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: testes (${{ matrix.os }})
        run: go test -short ./...

  cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # Os alvos que o README anuncia.
        target:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: windows, goarch: amd64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: build ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
        run: go build ./...
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
