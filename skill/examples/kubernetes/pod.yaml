apiVersion: v1
kind: Pod
metadata:
  name: loghub-service-demo
  labels:
    app: loghub-service-demo
spec:
  # Garante permissões adequadas no volume compartilhado para usuários nonroot
  securityContext:
    fsGroup: 65532

  volumes:
    - name: ident-data
      # A identidade só é estável se o volume sobreviver à recriação do Pod.
      # Um emptyDir é apagado em rollout, eviction ou drain do nó, e a
      # biblioteca geraria machine_id e agent_uuid novos (sem aviso, porque
      # não há arquivo corrompido, apenas ausente). Use um PVC dedicado por
      # Pod — ou um StatefulSet com volumeClaimTemplates. Para identidade
      # deliberadamente efêmera, troque por "emptyDir: {}".
      persistentVolumeClaim:
        claimName: loghub-ident-data

  containers:
    # --------------------------------------------------------------------------
    # Container Principal da Aplicação
    # --------------------------------------------------------------------------
    - name: app
      image: myregistry.internal/loghub-app:v1.0.0
      env:
        - name: DATADIR
          value: "/data"
        - name: WORKSPACE
          value: "production"
        # Hostname do Pod é resolvido nativamente pelo kernel
      volumeMounts:
        - name: ident-data
          mountPath: /data

    # --------------------------------------------------------------------------
    # Sidecar de Coleta de Logs / Telemetria
    # Compartilha intencionalmente o mesmo /data do container principal.
    # Ambos convergem para o mesmo MachineID (o Pod é o "nó") e para o mesmo
    # AgentUUID: nesta topologia o AgentUUID identifica a INSTÂNCIA (o Pod), e
    # a distinção entre app e sidecar vem do AgentName. Se o servidor chaveia
    # agentes por AgentUUID, dê a cada container o seu próprio AGENT_UUID via
    # env (ou um DATADIR próprio).
    # --------------------------------------------------------------------------
    - name: loghub-collector-sidecar
      image: myregistry.internal/loghub-collector:v1.0.0
      env:
        - name: DATADIR
          value: "/data"
        - name: WORKSPACE
          value: "production"
      volumeMounts:
        - name: ident-data
          mountPath: /data
---
# PVC dedicado ao Pod acima. Com StatefulSet, prefira volumeClaimTemplates,
# que cria um PVC por réplica automaticamente. Ajuste o tamanho ao mínimo da
# sua StorageClass: os arquivos de identidade ocupam poucas dezenas de bytes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loghub-ident-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
